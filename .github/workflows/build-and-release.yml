name: Build and Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_FILE: android/app/release.keystore
      KEYSTORE_PASSWORD: Julianna
      KEY_ALIAS: release
      KEY_PASSWORD: Juliannaifeoma$2007

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # ---------------------------------------------------------
      # BUILD WEB ASSETS (Crucial for Capacitor)
      # ---------------------------------------------------------
      - name: Build web app
        run: npm run build # Change to your framework's build command if different (e.g., ionic build)

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Check signing keystore
        id: check_keystore
        run: |
          if [ -f "$KEYSTORE_FILE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Signing keystore found."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Signing keystore not found."
          fi

      - name: Generate signing keystore
        if: steps.check_keystore.outputs.exists == 'false'
        run: |
          mkdir -p android/app
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_FILE" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Solana Wallet, OU=Dev, O=Solana Wallet, L=City, S=State, C=NG"

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: solana-wallet-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
